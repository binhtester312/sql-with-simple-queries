# ============================================================
# .github/workflows/nopcommerce-tests.yml
# GitHub Actions CI/CD cho NopCommerce Test Project
# ============================================================
# Mỗi khi bạn push code → GitHub tự động:
#   1. Build (compile Java code)
#   2. Chạy 3 nhóm test SONG SONG (parallel jobs)
#   3. Tổng hợp Allure Report và publish lên GitHub Pages

name: NopCommerce CI/CD Tests

# ── TRIGGER: Khi nào pipeline tự chạy? ──────────────────────
on:
  push:
    branches: [ main, develop ]   # Push lên main hoặc develop
  pull_request:
    branches: [ main ]             # Tạo Pull Request về main
  workflow_dispatch:               # Cho phép chạy thủ công từ GitHub UI

# ── Cấp quyền để publish lên GitHub Pages ───────────────────
permissions:
  contents: read
  pages: write
  id-token: write

# ============================================================
# JOB 1: BUILD — Biên dịch Java code
# ============================================================
jobs:
  build:
    name: "🔨 Build"
    runs-on: ubuntu-latest    # Dùng máy ảo Ubuntu mới nhất của GitHub

    steps:
      # Bước 1: Tải code về máy ảo
      - name: Checkout source code
        uses: actions/checkout@v4

      # Bước 2: Cài Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Bước 3: Cache Maven dependencies (tránh tải lại 200MB mỗi lần)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # Bước 4: Compile code
      - name: Compile project
        run: mvn clean compile -q
        # -q = quiet mode, ít log hơn

  # ============================================================
  # JOB 2a: TEST — LoginTest
  # ============================================================
  test-login:
    name: "🧪 Test: Login"
    runs-on: ubuntu-latest
    needs: build    # Chạy SAU khi job "build" thành công

    # ── Services: Docker containers phụ chạy song song với job ──
    # Khác GitLab: GitHub Actions truy cập service qua localhost:{port}
    services:
      # SQL Server Database
      nop_db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "Test@123456!"
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433    # Test code kết nối qua localhost:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test@123456!' -Q 'SELECT 1' -No"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

      # nopCommerce Web Application
      nop_web:
        image: nopcommerceteam/nopcommerce:latest
        ports:
          - 8080:80      # Test code kết nối qua localhost:8080
        env:
          ASPNETCORE_ENVIRONMENT: Development

      # Selenium Grid Chrome (chạy browser headless)
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444    # Test code kết nối qua localhost:4444
        env:
          SE_NODE_MAX_SESSIONS: "3"
        options: >-
          --shm-size=2g

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # Đợi services khởi động xong (SQL Server cần ~60 giây)
      - name: Wait for services to be ready
        run: |
          echo "⏳ Đợi SQL Server và nopCommerce khởi động..."
          sleep 60
          echo "✅ Services đã sẵn sàng!"

      - name: Run LoginTest
        env:
          # GitHub Actions: services truy cập qua localhost (khác GitLab!)
          BASE_URL: "http://localhost:8080"
          SELENIUM_HUB_URL: "http://localhost:4444/wd/hub"
          DB_URL: "jdbc:sqlserver://localhost:1433;database=NopCommerce;trustServerCertificate=true"
          DB_USER: "sa"
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}    # Lấy từ GitHub Secrets
        run: |
          echo "🧪 Chạy LoginTest..."
          mvn test \
            -Dsurefire.suiteXmlFiles=testng-login.xml \
            -DbaseUrl="${BASE_URL}" \
            -DgridUrl="${SELENIUM_HUB_URL}" \
            -Dheadless=true \
            -q
          echo "✅ LoginTest hoàn thành!"

      # Lưu kết quả Allure (kể cả khi test FAIL)
      - name: Upload Allure results
        if: always()    # always() = chạy dù bước trước fail
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-login
          path: target/allure-results/
          retention-days: 1

  # ============================================================
  # JOB 2b: TEST — RegisterTest_JavaFaker
  # ============================================================
  test-register-faker:
    name: "🧪 Test: Register (Faker)"
    runs-on: ubuntu-latest
    needs: build

    services:
      nop_db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "Test@123456!"
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test@123456!' -Q 'SELECT 1' -No"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

      nop_web:
        image: nopcommerceteam/nopcommerce:latest
        ports:
          - 8080:80
        env:
          ASPNETCORE_ENVIRONMENT: Development

      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        env:
          SE_NODE_MAX_SESSIONS: "3"
        options: >-
          --shm-size=2g

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Wait for services to be ready
        run: sleep 60

      - name: Run RegisterTest_JavaFaker
        env:
          BASE_URL: "http://localhost:8080"
          SELENIUM_HUB_URL: "http://localhost:4444/wd/hub"
          DB_URL: "jdbc:sqlserver://localhost:1433;database=NopCommerce;trustServerCertificate=true"
          DB_USER: "sa"
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "🧪 Chạy RegisterTest_JavaFaker..."
          mvn test \
            -Dsurefire.suiteXmlFiles=testng-register-faker.xml \
            -DbaseUrl="${BASE_URL}" \
            -DgridUrl="${SELENIUM_HUB_URL}" \
            -Dheadless=true \
            -q
          echo "✅ RegisterTest_JavaFaker hoàn thành!"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-register-faker
          path: target/allure-results/
          retention-days: 1

  # ============================================================
  # JOB 2c: TEST — RegisterTest_CurrentTimeMillis
  # ============================================================
  test-register-millis:
    name: "🧪 Test: Register (Millis)"
    runs-on: ubuntu-latest
    needs: build

    services:
      nop_db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "Test@123456!"
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test@123456!' -Q 'SELECT 1' -No"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

      nop_web:
        image: nopcommerceteam/nopcommerce:latest
        ports:
          - 8080:80
        env:
          ASPNETCORE_ENVIRONMENT: Development

      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        env:
          SE_NODE_MAX_SESSIONS: "3"
        options: >-
          --shm-size=2g

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Wait for services to be ready
        run: sleep 60

      - name: Run RegisterTest_CurrentTimeMillis
        env:
          BASE_URL: "http://localhost:8080"
          SELENIUM_HUB_URL: "http://localhost:4444/wd/hub"
          DB_URL: "jdbc:sqlserver://localhost:1433;database=NopCommerce;trustServerCertificate=true"
          DB_USER: "sa"
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "🧪 Chạy RegisterTest_CurrentTimeMillis..."
          mvn test \
            -Dsurefire.suiteXmlFiles=testng-register-millis.xml \
            -DbaseUrl="${BASE_URL}" \
            -DgridUrl="${SELENIUM_HUB_URL}" \
            -Dheadless=true \
            -q
          echo "✅ RegisterTest_CurrentTimeMillis hoàn thành!"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-register-millis
          path: target/allure-results/
          retention-days: 1

  # ============================================================
  # JOB 3: REPORT — Tổng hợp Allure Report + publish GitHub Pages
  # ============================================================
  allure-report:
    name: "📊 Allure Report"
    runs-on: ubuntu-latest
    # Chạy SAU KHI cả 3 jobs test xong (dù pass hay fail)
    needs: [ test-login, test-register-faker, test-register-millis ]
    if: always()    # Luôn chạy để có report xem lý do fail

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Tải kết quả từ 3 jobs test về
      - name: Download Allure results (Login)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-login
          path: allure-results/
        continue-on-error: true   # Không fail nếu job test bị skip

      - name: Download Allure results (Register Faker)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-register-faker
          path: allure-results/
        continue-on-error: true

      - name: Download Allure results (Register Millis)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-register-millis
          path: allure-results/
        continue-on-error: true

      # Cài Allure CLI và tạo report HTML
      - name: Generate Allure Report
        run: |
          echo "📊 Đang tạo Allure Report..."
          # Tải và cài Allure CLI
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz -C /opt/
          export PATH=$PATH:/opt/allure-2.27.0/bin
          # Tạo report HTML (output vào thư mục 'gh-pages')
          allure generate allure-results -o gh-pages --clean
          echo "✅ Report đã tạo xong!"

      # Publish lên GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report URL
        run: echo "🌐 Xem Allure Report tại ${{ steps.deployment.outputs.page_url }}"
