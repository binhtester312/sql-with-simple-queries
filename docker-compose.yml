
services:

  # ─────────────────────────────────────────────
  # 1. SQL Server (Express – miễn phí, đủ dùng)
  # ─────────────────────────────────────────────
  nopcommerce_db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nop_sqlserver
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SA_PASSWORD: "Test@123456!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql          # named volume – Docker tự quản lý
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test@123456!' -Q 'SELECT 1' -No || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ─────────────────────────────────────────────
  # 2. nopCommerce Web Application
  # ─────────────────────────────────────────────
  nopcommerce_web:
    image: nopcommerceteam/nopcommerce:latest
    container_name: nop_web
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      nopcommerce_db:
        condition: service_healthy
    volumes:
      - nop_appdata:/app/App_Data          # named volume – giữ nguyên file trong container
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  # ─────────────────────────────────────────────
  # 3. Selenium Grid standalone Chrome (arm64)
  # ─────────────────────────────────────────────
  selenium_chrome:
    image: seleniarm/standalone-chromium:latest
    container_name: nop_selenium_chrome
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "4444:4444"
      - "7900:7900"                         # noVNC: xem browser live
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_VNC_NO_PASSWORD=1

# ── Named volumes (Docker tự tạo và quản lý) ──
volumes:
  mssql_data:
  nop_appdata:

networks:
  default:
    name: nopcommerce_network
