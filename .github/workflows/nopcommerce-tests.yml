# ============================================================
# .github/workflows/nopcommerce-tests.yml
# FIX v2:
#   - BỎ Selenium Grid service container (gây ERR_CONNECTION_REFUSED)
#   - THÊM setup-chrome: Chrome chạy trực tiếp trên runner
#   - Chrome trên runner -> localhost:8080 = nopCommerce OK
#   - Tăng sleep 60 -> 120s cho SQL Server + nopCommerce startup
# ============================================================

name: NopCommerce CI/CD Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Chạy tự động lúc 00:00 giờ Việt Nam (UTC+7) mỗi đêm
  # GitHub Actions dùng UTC → 00:00 VN = 17:00 UTC ngày hôm trước
  # Cú pháp cron: phút giờ ngày tháng thứ
  schedule:
    - cron: '0 17 * * *'   # 00:00 VN (UTC+7) mỗi ngày


permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ============================================================
  # JOB 1: BUILD
  # ============================================================
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Compile project
        run: mvn clean compile -q

  # ============================================================
  # JOB 2a: TEST - LoginTest
  # FIX: Bo Selenium Grid service, dung Chrome tren runner
  # ============================================================
  test-login:
    name: "Test: Login"
    runs-on: ubuntu-latest
    needs: build

    services:
      nop_db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "Test@123456!"
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test@123456!' -Q 'SELECT 1' -No"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

      nop_web:
        image: nopcommerceteam/nopcommerce:latest
        ports:
          - 8080:80
        env:
          ASPNETCORE_ENVIRONMENT: Development

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # FIX: Cai Chrome truc tiep tren runner (khong dung Selenium Grid container)
      - name: Setup Chrome browser
        uses: browser-actions/setup-chrome@v1

      - name: Wait for services to be ready
        run: |
          echo "Doi SQL Server va nopCommerce khoi dong..."
          sleep 30

      - name: Auto-install nopCommerce
        run: |
          chmod +x init-scripts/auto_install_nopcommerce.py
          python3 init-scripts/auto_install_nopcommerce.py http://localhost:8080 localhost,1433

      - name: Run LoginTest
        env:
          BASE_URL: "http://localhost:8080"
          # KHONG set SELENIUM_HUB_URL
          # BaseTest.java se dung ChromeDriver local (khong phai RemoteWebDriver)
          # Chrome local co the access localhost:8080 binh thuong
          DB_URL: "jdbc:sqlserver://localhost:1433;database=NopCommerce;trustServerCertificate=true"
          DB_USER: "sa"
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Chay LoginTest..."
          mvn test \
            -Dsurefire.suiteXmlFiles=testng-login.xml \
            -DbaseUrl="${BASE_URL}" \
            -Dheadless=true \
            -q

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-login
          path: target/allure-results/
          retention-days: 1

  # ============================================================
  # JOB 2b: TEST - RegisterTest_JavaFaker
  # ============================================================
  test-register-faker:
    name: "Test: Register (Faker)"
    runs-on: ubuntu-latest
    needs: build

    services:
      nop_db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "Test@123456!"
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test@123456!' -Q 'SELECT 1' -No"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

      nop_web:
        image: nopcommerceteam/nopcommerce:latest
        ports:
          - 8080:80
        env:
          ASPNETCORE_ENVIRONMENT: Development

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Setup Chrome browser
        uses: browser-actions/setup-chrome@v1

      - name: Wait for services to be ready
        run: |
          echo "Doi SQL Server va nopCommerce khoi dong..."
          sleep 30

      - name: Auto-install nopCommerce
        run: |
          chmod +x init-scripts/auto_install_nopcommerce.py
          python3 init-scripts/auto_install_nopcommerce.py http://localhost:8080 localhost,1433

      - name: Run RegisterTest_JavaFaker
        env:
          BASE_URL: "http://localhost:8080"
          DB_URL: "jdbc:sqlserver://localhost:1433;database=NopCommerce;trustServerCertificate=true"
          DB_USER: "sa"
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Chay RegisterTest_JavaFaker..."
          mvn test \
            -Dsurefire.suiteXmlFiles=testng-register-faker.xml \
            -DbaseUrl="${BASE_URL}" \
            -Dheadless=true \
            -q

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-register-faker
          path: target/allure-results/
          retention-days: 1

  # ============================================================
  # JOB 2c: TEST - RegisterTest_CurrentTimeMillis
  # ============================================================
  test-register-millis:
    name: "Test: Register (Millis)"
    runs-on: ubuntu-latest
    needs: build

    services:
      nop_db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "Test@123456!"
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test@123456!' -Q 'SELECT 1' -No"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

      nop_web:
        image: nopcommerceteam/nopcommerce:latest
        ports:
          - 8080:80
        env:
          ASPNETCORE_ENVIRONMENT: Development

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Setup Chrome browser
        uses: browser-actions/setup-chrome@v1

      - name: Wait for services to be ready
        run: |
          echo "Doi SQL Server va nopCommerce khoi dong..."
          sleep 30

      - name: Auto-install nopCommerce
        run: |
          chmod +x init-scripts/auto_install_nopcommerce.py
          python3 init-scripts/auto_install_nopcommerce.py http://localhost:8080 localhost,1433

      - name: Run RegisterTest_CurrentTimeMillis
        env:
          BASE_URL: "http://localhost:8080"
          DB_URL: "jdbc:sqlserver://localhost:1433;database=NopCommerce;trustServerCertificate=true"
          DB_USER: "sa"
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Chay RegisterTest_CurrentTimeMillis..."
          mvn test \
            -Dsurefire.suiteXmlFiles=testng-register-millis.xml \
            -DbaseUrl="${BASE_URL}" \
            -Dheadless=true \
            -q

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-register-millis
          path: target/allure-results/
          retention-days: 1

  # ============================================================
  # JOB 3: REPORT - Allure Report -> GitHub Pages
  # ============================================================
  allure-report:
    name: "Allure Report"
    runs-on: ubuntu-latest
    needs: [ test-login, test-register-faker, test-register-millis ]
    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Allure results (Login)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-login
          path: allure-results/
        continue-on-error: true

      - name: Download Allure results (Register Faker)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-register-faker
          path: allure-results/
        continue-on-error: true

      - name: Download Allure results (Register Millis)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-register-millis
          path: allure-results/
        continue-on-error: true

      - name: Generate Allure Report
        run: |
          echo "Dang tao Allure Report..."
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz -C /opt/
          export PATH=$PATH:/opt/allure-2.27.0/bin
          allure generate allure-results -o gh-pages --clean
          echo "Report da tao xong!"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print Report URL
        run: echo "Xem Allure Report tai ${{ steps.deployment.outputs.page_url }}"
